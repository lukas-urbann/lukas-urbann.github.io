# Projekty v pořadí, v jakém se zobrazí na webu.
# image: soubor ve složce page/img/projects/
# links: libovolná kombinace itch / youtube / github / unity / steam (pořadí = pořadí ikon)

- image: vykolejen.webp
  links:
    itch: https://gameutb.itch.io/train-game
  cz:
    title: Vykolejen
    description: Tento projekt vznikl v rámci Bohemia GameJam 2026. V této návykové hře budete muset opravit svůj vlak dříve, než vás v tom zastaví sabotér, a zároveň se pokusit dovézt vlak do cílové stanice co nejrychleji. Druhý hráč naopak musí způsobit dostatečné škody, aby vlak nedorazil do stanice včas.
  en:
    title: Vykolejen
    description: This is a project created for Bohemia GameJam 2026. In this addictive game, you’ll have to repair your train before the saboteur can stop you, all while trying to get the train to the destination station as quickly as possible. The second player, on the other hand, must cause enough damage to prevent the train from reaching the station on time.

- image: bab.webp
  links:
    itch: https://redhavoc12.itch.io/batove-a-bacove
    youtube: https://youtu.be/JiFpAxiybrE
    github: https://github.com/lukas-urbann/batove-a-bacove/
  cz:
    title: Baťové a Bačové
    description: Projekt vytvořen pro Game Jam Zlín 2026 s tématem 'Robota'. Ve hře se ocitáte v roli soudce v jeho repetetivní práci, kde hráč rozhoduje o trestech obviněných lidí. Je potřeba řešit spory mezi chudými a bohatými a starat se, aby Vás obě strany snášely. Zároveň je potřeba jednou za čas vzít úplatek, protože ze svého platu těžko zaplatíte vlastní pohledávky. Dialogy v této hře jsou náhodně generované z vybrané kolekce slov a vět.
  en:
    title: Baťové a Bačové
    description: A project created for Game Jam Zlín 2026 with the theme 'Hard Work'. In the game, you find yourself in the role of a judge in his repetitive work, where the player decides on the punishments of accused people. You need to resolve disputes between the poor and the rich and make sure that both sides tolerate you. At the same time, you need to take bribes from time to time, because it is difficult to pay your own debts from your salary. The dialogues in this game are randomly generated from a selected collection of words and sentences.

- image: copycat.webp
  links:
    itch: https://redhavoc12.itch.io/copycat
    youtube: https://youtu.be/5nnqI2NQsyY
  cz:
    title: Copycat
    description: Jedná se o mou bakalářskou práci v rámci studia softwarového inženýrství na UTB. Je to hra vytvořená v Unity pomocí 3D generativní umělé inteligence. Obsahuje různé hádanky, které musí hráč vyřešit.
  en:
    title: Copycat
    description: This is my bachelor's thesis for my software engineering degree at UTB. It is a game created in Unity using 3D generative artificial intelligence. Contains various puzzles for the player to solve.

- image: tcw.webp
  links:
    itch: https://redhavoc12.itch.io/this-cant-work
    youtube: https://youtu.be/2rvRYTdDgg4
    github: https://github.com/lukas-urbann/game-jam-zlin-2025/
  cz:
    title: Tohle Nemůže Fungovat!
    description: Zapomeň na tvorbu vlastního projektu! Tvým jediným cílem je sabotovat práci soupeře jakýmikoliv prostředky. Mlácení do klávesnice? Špinavé triky? Neúprosná sabotáž? Rozhodně! A když slehne prach, kdo ví, jestli někdo svou hru skutečně dokončí?
  en:
    title: This Can't Work!
    description: Forget polishing your own project! Your only goal is to sabotage your opponent's work by any means necessary. Keyboard slamming? Dirty tricks? Relentless sabotage? Absolutely! And when the dust settles, who knows if anyone will actually finish their game?

