intro:
  title:
    cz: Vítej na<br>mém portfóliu.
    en: Welcome to my<br>portfolio.
  text:
    cz: <span class='text-normal-red'>Věnuji se tvorbě videoher</span> a videohernímu designu. <span class='text-normal-red'>Je to má vášeň,</span> kterou si pěstuji od svého dětství.
    en: I am a <span class='text-normal-red'>video game designer</span> and developer. It's a <span class='text-normal-red'>passion of mine</span> that I've been cultivating since I was a kid.

projects:
  title:
    cz: Projekty,<br>na kterých<br>jsem pracoval
    en: Projects<br>I worked on

about:
  title:
    cz: O mně
    en: About me
  thats_me:
    cz: To jsem já
    en: That's me
  items:
    - cz: Jsem {age}-letý student, programátor.
      en: I'm a {age}-year-old student.
    - cz: Zaměřuji se na tvorbu video her a videoherních assetů.
      en: I focus on creating video games and video game assets.
    - cz: Úspěšně jsem dokončil bakalářské studium softwarového inženýrství na <a href='https://fai.utb.cz/' class='text-normal-red underline'>UTB</a>.
      en: I successfully completed my bachelor's degree in software engineering at <a href='https://fai.utb.cz/' class='text-normal-red underline'>TBU</a>.
    - cz: Svou první hru jsem vytvořil v 6 letech v GameMakeru 8.
      en: I created my first game at the age of 6 in GameMaker.
    - cz: Specializuji se na programování v jazyce C#.
      en: I specialize in C# programming.
    - cz: Disponuji vynikajícími komunikačními a týmovými schopnostmi.
      en: I have excellent communication and teamwork skills.
    - cz: S různými společnostmi, jako je například Polyperfect, spolupracuji již dlouhou dobu.
      en: I have been working with various companies, such as Polyperfect, for a long time.
    - cz: Jsem velmi flexibilní a snadno se přizpůsobuji novým situacím.
      en: I am very flexible and adapt easily to new situations.
    - cz: Dobře zapadám do kolektivu a přispívám k pozitivní pracovní atmosféře.
      en: I fit well into a team and contribute to a positive working atmosphere.
    - cz: Jsem otevřený spolupráci a přijímám zakázky.
      en: I am open to collaboration and accept commissions.

