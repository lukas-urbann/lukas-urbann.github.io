name: Deploy to urban-lukas.cz (FTP)

# Builds the site and uploads _site/ to the web hosting over FTP.
# Setup (repository Settings -> Secrets and variables -> Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_SERVER_DIR (folder of the website on the server, ending with "/")
#              FTP_PROTOCOL   (optional, "ftps" by default; set to "ftp" if the hosting has no FTPS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be uploaded, don't change anything on the server"
        type: boolean
        default: true
  # Rebuild so the age ({age}) and the footer year stay current: 1 January and the day of the birthday (site.yaml).
  schedule:
    - cron: "0 6 1 1 *"
    - cron: "0 6 4 3 *"

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the FTP target is configured, so pushes don't fail before setup.
    if: vars.FTP_SERVER_DIR != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
